<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart | Crypto Signal</title>
    <link rel="stylesheet" href="/css/app.css">
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/js/format.js"></script>
    <script src="/js/signal-view.js"></script>
    <script src="/js/app-header.js"></script>
    <script src="/js/pane-chart.js"></script>
</head>
<body class="full">
    <header id="app-header" data-view="chart">
        <div data-header-slot="left" class="row">
            <span id="price" class="t-headline strong" title="Live price, for display only">-</span>
        </div>
        <div data-header-slot="right" class="row">
            <span id="conn" class="conn">Connecting</span>
            <button id="copy" type="button" class="btn small" title="Copy this timeframe's latest values as JSON">Copy data</button>
        </div>
    </header>

    <main class="chart-page">
        <div class="row-between">
            <div class="row">
                <div id="tf-selector" class="segment" role="group" aria-label="Timeframe"></div>
                <div id="levels" class="row t-meta num"></div>
            </div>
            <span id="chart-status" class="t-meta muted"></span>
        </div>
        <div id="chart"></div>
    </main>

    <script src="/js/pages/chart.js"></script>
</body>
</html>
