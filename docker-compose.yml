services:
  vpn:
    image: qmcgaw/gluetun:latest
    container_name: crypto-signal-vpn

    cap_add:
      - NET_ADMIN

    devices:
      - /dev/net/tun:/dev/net/tun

    volumes:
      - ./gluetun:/gluetun:ro

    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      TZ: Asia/Jakarta

    ports:
      # Published on the host's loopback only by default. Set BIND_ADDR=0.0.0.0 to expose it on the
      # network (the app has no authentication).
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-11000}:${PORT:-11000}"

    restart: unless-stopped

  app:
    build: .
    container_name: crypto-signal

    network_mode: "service:vpn"

    env_file:
      - .env

    environment:
      # Inside the VPN namespace the app must listen on all interfaces so the published port reaches it.
      HOST: 0.0.0.0

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      vpn:
        condition: service_healthy

    restart: unless-stopped
